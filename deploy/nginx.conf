# 将 grad.example.edu 替换为正式域名。先建立 HTTP 站点，再用 Certbot 配置 HTTPS。
# 如果服务器已有默认站点，请合并默认规则，避免重复 default_server。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name grad.example.edu;
    client_max_body_size 32m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    sendfile on;

    location /static/ {
        alias /srv/gradconnect/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # 仅允许经 Django 校验权限后，使用 X-Accel-Redirect 内部转发。
    location ^~ /_protected/ {
        internal;
        alias /srv/gradconnect/media/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /private-media/ { return 404; }

    # 大批量账号校验含密码哈希计算，仅此入口允许等待最多十分钟。
    location = /accounts/upload/ {
        client_max_body_size 6m;
        include /srv/gradconnect/deploy/proxy_common.conf;
        proxy_read_timeout 600s;
    }

    # Video: one 500 MB MP4; leave room for the multipart envelope.
    location = /videos/new/ {
        client_max_body_size 512m;
        include /srv/gradconnect/deploy/proxy_common.conf;
    }

    # Guides: at most ten 20 MB attachments, including edits/replacements.
    location ~ ^/guides/(new|[0-9]+/edit)/$ {
        client_max_body_size 256m;
        include /srv/gradconnect/deploy/proxy_common.conf;
    }

    # Registration: at most ten 20 MB attachments.
    location ~ ^/(internships|rentals)/(new|[0-9]+/resubmit)/$ {
        client_max_body_size 256m;
        include /srv/gradconnect/deploy/proxy_common.conf;
    }

    location / {
        include /srv/gradconnect/deploy/proxy_common.conf;
    }
}
