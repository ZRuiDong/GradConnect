<div class="notice info">
  <p><a href="{% url 'account_template' %}?mode=update">下载政治面貌更新模板（学号、政治面貌两列）</a></p>
  <p>批量更新时，选择“补充 / 更新已有学生资料”，仅保留“学号”和需要修改的资料列。未包含的列保持原值；选填列留空会清空该项，必填列不能留空。初始密码列可删除，保留时必须留空。</p>
  <p>例如只更新政治面貌：填写学号和“群众、共青团员、共青团员（入党积极分子）、共青团员（发展对象）、预备党员、正式党员”之一，上传后核对预览，再确认整批更新。</p>
  <p>“在校状态”填写“在校”或“毕业”；“所在班级”填写班级名称，“院系”填写学院或系名称，两列含义不同。</p>
</div>
