<div class="sortable-heading"><span>{{ column.label }}</span><span class="sort-controls">{% for link in column.links %}<a class="sort-direction{% if link.active %} is-active{% endif %}" href="{{ link.url }}" aria-label="{{ column.label }}{{ link.label }}" title="{{ column.label }}{{ link.label }}"><span class="sort-triangle {{ link.direction }}" aria-hidden="true"></span></a>{% endfor %}</span></div>
